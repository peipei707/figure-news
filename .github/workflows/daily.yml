name: daily

on:
  schedule:
    - cron: "37 23 * * *"  # 07:37 Beijing time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scrape.py
      - build_site.py
      - page/**
      - requirements.txt
      - .github/workflows/daily.yml

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape
        run: python scrape.py

      # Commit even when every source failed, so README shows what happened.
      - name: Commit results
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Daily update $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase
          git push

      # The same page as the claude.ai one, as a complete document for GitHub Pages.
      - name: Build the web page
        if: ${{ !cancelled() }}
        run: python build_site.py --standalone

      - uses: actions/upload-pages-artifact@v4
        if: ${{ !cancelled() }}
        with:
          path: build

  pages:
    needs: scrape
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

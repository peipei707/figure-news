name: daily

on:
  schedule:
    - cron: "37 23 * * *"  # 07:37 Beijing time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scrape.py
      - requirements.txt
      - .github/workflows/daily.yml

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape
        run: python scrape.py

      # Commit even when every source failed, so README shows what happened.
      - name: Commit results
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Daily update $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase
          git push
